services:
  postgres:
    image: postgres:16-alpine
    container_name: sales-agent-postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?ERROR - POSTGRES_USER must be set in .env file}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?ERROR - POSTGRES_PASSWORD must be set in .env file}"
      POSTGRES_DB: "${POSTGRES_DB:?ERROR - POSTGRES_DB must be set in .env file}"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sales-agent-network

  redis:
    image: redis/redis-stack-server:latest
    container_name: sales-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sales-agent-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sales-agent-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:?ERROR - PGADMIN_DEFAULT_EMAIL must be set in .env file}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:?ERROR - PGADMIN_DEFAULT_PASSWORD must be set in .env file}"
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - sales-agent-network

  # Flower - Real-time Celery Task Monitoring
  # Access at: http://localhost:5555
  # Shows: Task status, worker health, agent executions
  flower:
    image: mher/flower:latest
    container_name: sales-agent-flower
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-coperniq_flower_2024}
    depends_on:
      - redis
    networks:
      - sales-agent-network

  # Neo4j Graph Database for Relationship Mapping
  # Used for: Referral chain discovery, warm path finding, dot-connecting
  neo4j:
    image: neo4j:5.26-community
    container_name: sales-agent-neo4j
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-coperniq_graph_2024}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
    ports:
      - "7474:7474"  # HTTP (Browser UI)
      - "7687:7687"  # Bolt (Driver connections)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - sales-agent-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

networks:
  sales-agent-network:
    driver: bridge
