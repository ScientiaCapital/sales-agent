[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scientia-vlm-core"
version = "0.1.0"
description = "Enterprise-grade Vision-Language Model (VLM) services for construction AI"
readme = "README.md"
license = {text = "Proprietary - Scientia Capital"}
requires-python = ">=3.11"
authors = [
    { name = "Scientia Capital", email = "dev@scientiacapital.ai" }
]
keywords = ["vlm", "vision", "ai", "qwen", "deepseek", "construction", "blueprint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",  # Image processing for cropping/resizing
    # Scientia Capital core infrastructure
    "lang-core @ git+https://github.com/ScientiaCapital/lang-core.git",
]

[project.optional-dependencies]
openrouter = ["openai>=1.0.0"]  # OpenAI SDK for OpenRouter API compatibility
all = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.urls]
Repository = "https://github.com/ScientiaCapital/vlm-ai-core"

[tool.hatch.build.targets.wheel]
packages = ["vlm_core", "services"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=vlm_core --cov-report=term-missing"
markers = [
    "e2e: End-to-end tests requiring running services",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
