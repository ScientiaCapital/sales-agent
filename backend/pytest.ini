[pytest]
# Pytest configuration for Social Intelligence tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

testpaths = tests

addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    database: Database tests

asyncio_mode = auto

# Environment variables for testing (set before any imports via pytest-env)
env =
    DATABASE_URL=sqlite:///:memory:
